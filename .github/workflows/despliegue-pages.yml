name: Despliegue en GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  preparar:
    name: Validar y preparar sitio
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v6
      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verificar sintaxis
        run: npm run verificar
      - name: Ejecutar pruebas
        run: npm test
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6
      - name: Preparar archivos públicos
        run: |
          mkdir sitio
          cp index.html styles.css script.js utilidades.js sitio/
          touch sitio/.nojekyll
      - name: Publicar artefacto
        uses: actions/upload-pages-artifact@v5
        with:
          path: sitio

  desplegar:
    name: Desplegar sitio
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: preparar
    steps:
      - name: Desplegar en GitHub Pages
        id: despliegue
        uses: actions/deploy-pages@v5
